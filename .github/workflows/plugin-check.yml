name: 'Plugin Check'
on:
  pull_request:
  push:
    branches: main
  workflow_dispatch:
  workflow_call: # Triggered by other workflows
  schedule:
    - cron: '0 8 * * *'
jobs:
  test:
    name: Run plugin check
    concurrency:
      group: ${{ github.workflow }} - ${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - uses: actions/setup-node@v6
      id: setup-node
      with:
        node-version: lts/*
        cache: 'npm'
        cache-dependency-path: |
          package-lock.json
          package.json

    - name: Cache node_modules and npm cache
      id: cache-node-modules
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          ~/.npm
        key: ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-npm-${{ hashFiles('package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-${{ steps.setup-node.outputs.node-version }}-npm-

    - name: npm install and build
      if: steps.cache-node-modules.outputs.cache-hit != 'true'
      run: |
        npm ci --prefer-offline --no-audit --no-fund
        npm run build
      env:
        CI: true

    - name: Build when cache hit
      if: steps.cache-node-modules.outputs.cache-hit == 'true'
      run: npm run build
      env:
        CI: true

    - name: Copy plugin files
      run: rsync -a --delete --exclude-from='.distignore' ./ block-starter/

    - name: Download wp-cli
      run: curl -sL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o wp-cli.phar

    - name: Create plugin-check blueprint
      run: |
        cat > plugin-check-blueprint.json <<'EOF'
        {
          "$schema": "https://playground.wordpress.net/blueprint-schema.json",
          "steps": [
            {
              "step": "installPlugin",
              "pluginData": {
                "resource": "wordpress.org/plugins",
                "slug": "plugin-check"
              }
            },
            {
              "step": "activatePlugin",
              "pluginPath": "plugin-check/plugin.php"
            },
            {
              "step": "activatePlugin",
              "pluginPath": "block-starter/block-starter.php"
            }
          ]
        }
        EOF

    - name: Run plugin check
      run: |
        npx wp-playground-cli php \
          --blueprint=plugin-check-blueprint.json \
          --mount="$(pwd)/block-starter:/wordpress/wp-content/plugins/block-starter" \
          --wp=latest \
          -- "$(pwd)/wp-cli.phar" plugin check block-starter
